services:
  mysql:
    image: mysql:8.0
    container_name: smartproject-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smartproject}
      MYSQL_USER: ${MYSQL_USER:-smartproject}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-smartproject}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
