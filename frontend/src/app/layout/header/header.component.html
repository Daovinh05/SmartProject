<header class="site-header">
  <div class="header-inner">
    <a routerLink="/" class="brand" aria-label="SmartProject trang chủ">
      <span class="brand-mark" aria-hidden="true">S</span>
      <span class="brand-text">
        <strong>SmartProject</strong>
        <small>Smart Solutions Việt Nam</small>
      </span>
    </a>
    <nav class="site-nav" aria-label="Điều hướng chính">
      <a routerLink="/">Trang chủ</a>
      @if (isLoggedIn) {
        <span class="user" [attr.data-initial]="(profile?.username || username || '?').charAt(0).toUpperCase()">Xin chào, {{ profile?.username || username }}</span>
        <button class="link-btn" (click)="onLogout()">Đăng xuất</button>
      } @else {
        <a routerLink="/login" class="login-link">Đăng nhập</a>
      }
    </nav>
  </div>
</header>
