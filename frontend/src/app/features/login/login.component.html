<section class="login-wrap" aria-labelledby="login-title">
  <div class="card login-card">
    <h1 id="login-title">Đăng nhập SmartProject</h1>
    <p class="text-secondary">
      Sử dụng tài khoản Keycloak của Smart Solutions Việt Nam .
    </p>
    <button class="btn-primary" (click)="onLogin()">Đăng nhập với Keycloak</button>
    @if (error) {
      <p class="text-error" role="alert">{{ error }}</p>
    }
  </div>
</section>
