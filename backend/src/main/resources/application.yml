server:
  port: 8080

spring:
  application:
    name: smartproject-backend
  security:
    oauth2:
      resourceserver:
        jwt:
          # Task 4: lấy từ config, không hardcode trong code.
          # Có thể override bằng env: JWT_ISSUER_URI
          issuer-uri: ${JWT_ISSUER_URI:https://id.smartsolutionvn.com.vn/realms/ssvn}
  datasource:
    # Task 6: MySQL chạy bằng docker-compose.yml ở root.
    url: ${DB_URL:jdbc:mysql://localhost:3306/smartproject?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:smartproject}
    password: ${DB_PASSWORD:smartproject}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # Greenfield nên để update tự tạo bảng; production đổi sang validate + migration.
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
